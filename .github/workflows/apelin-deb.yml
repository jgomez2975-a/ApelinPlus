name: Apelin .deb (upstream)

# Builds the real Apelin package on a GitHub macOS runner, so no Mac is
# needed anywhere in the loop. Clones upstream, applies the patches in
# `patches/`, runs the project's own Makefile, uploads the .deb.
#
# Runs on a push that touches the patches, so the package and the patch that
# changed it stay one act. Manual dispatch stays available for every other
# case: build a different tag, try the preview runner, or skip the patches.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Jailbreak layout'
        type: choice
        options: [roothide, rootless, both]
        default: roothide
      ref:
        description: 'Upstream ref (branch or tag) — v0.4.7 is the current release'
        required: true
        default: v0.4.7
      runner:
        description: 'Runner image — macos-26 is stable, xcode-27 matches upstream but is a preview that gets reclaimed'
        type: choice
        options: [macos-26, xcode-27]
        default: macos-26
      apply_patches:
        description: 'Apply patches/*.patch from this repo after cloning'
        type: boolean
        default: true
      skip_checks:
        description: 'SKIP_HARNESS=1 (required: the device harness needs a phone)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/apelin-deb.yml'

concurrency:
  group: deb-${{ github.ref }}
  # Not cancel-in-progress: a build that has already spent fifteen minutes
  # is worth more than the freshness of the next one, and an accidental
  # double click should not throw the first away.
  cancel-in-progress: false

env:
  # The canonical repository. `wwg135/Apelin` is a fork that stopped at
  # v0.3.7 on 2026-11-04 — building that produced a 0.3.7 package when the
  # released version was already 0.4.7. Check `fork: true` before swapping
  # this for another URL.
  UPSTREAM: https://github.com/owngoal-dev/Apelin.git

jobs:
  deb:
    # Everything below reads `inputs.x || '<default>'`: a push carries no
    # inputs, and an empty `runs-on` is a job that never gets a runner.
    name: make deb (${{ inputs.flavor || 'roothide' }}) · ${{ inputs.ref || 'v0.4.7' }}
    # Two images, two trade-offs:
    #
    # `macos-26` — stable GA, Xcode 26.6 with iOS SDK 26.5. Upstream pins
    # IOS_SDK_TIER 27.1 and its `sdk-tier` target exits 69 below that, so
    # this image needs patches/0000-lower-ios-sdk-tier.patch. The package
    # that comes out is linked against 26.5 rather than 27.1, which matters
    # only if the code uses an iOS 27 API — the build says so if it does.
    #
    # `xcode-27` — macOS 27 with Xcode 27.1 (iOS SDK 27.1), which is what
    # upstream asks for, no patch needed. It is a public preview: one
    # attempt here was reclaimed two minutes into xcodebuild with
    # "The operation was canceled". Green when it holds, gone when it does
    # not.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - name: Checkout builder (for patches)
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Clone upstream
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.ref || 'v0.4.7' }}" "$UPSTREAM" upstream
          cd upstream
          git log --oneline -1
          echo "files: $(git ls-files | wc -l)"

      - name: Apply patches
        if: ${{ github.event_name == 'push' || inputs.apply_patches }}
        run: |
          set -euo pipefail
          cd upstream
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches in patches/ — building pristine upstream."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "--- applying $(basename "$p")"
            # Plain apply first: a --depth 1 clone has none of the blobs the
            # patch names, so --3way falls back to an ordinary apply anyway
            # and prints a warning that reads like a failure.
            if git apply "$p"; then
              echo "    applied"
            else
              echo "    plain apply failed, retrying with --3way"
              git apply --3way --verbose "$p"
            fi
          done
          git status --short

      - name: Resolve version
        run: |
          set -euo pipefail
          cd upstream
          # After the patches: 0002 sets the version this build ships as.
          marketing=$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig)
          build=$(sed -n 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*//p' Configuration/Version.xcconfig)
          echo "MARKETING_VERSION=$marketing  CURRENT_PROJECT_VERSION=$build"
          # `--depth 1` makes the Makefile's `git rev-list --count HEAD`
          # default come out as 1, which would label the build 0.4.7 (1) and
          # put a number in Info.plist that disagrees with the xcconfig.
          # Take the release's own number instead.
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "APP_VERSION=$marketing" >> "$GITHUB_ENV"

      - name: Packaging tools
        run: |
          set -uo pipefail
          # dpkg provides dpkg-deb; zstd is what package-deb.sh compresses
          # with; ldid is what signs the Mach-O binaries for a jailbroken
          # device. Each is checked by the project's own `check` target.
          brew install dpkg zstd || true
          brew install ldid || brew install ProcursusTeam/ldid/ldid || true
          for tool in ldid dpkg-deb zstd xcodebuild; do
            if command -v "$tool" >/dev/null; then
              echo "ok: $tool -> $(command -v "$tool")"
            else
              echo "::error::missing $tool"
            fi
          done

      - name: Build and package
        run: |
          set -uo pipefail
          cd upstream
          SKIP=""
          if [ "${{ github.event_name == 'push' || inputs.skip_checks }}" = "true" ]; then SKIP="SKIP_HARNESS=1"; fi

          case "${{ inputs.flavor || 'roothide' }}" in
            roothide) TARGET=deb-roothide ;;
            rootless) TARGET=deb-rootless ;;
            both)     TARGET=deb-all ;;
          esac

          echo "=== make $TARGET $SKIP ==="
          make "$TARGET" $SKIP

      - name: List packages
        if: always()
        run: |
          # BSD find on macOS has no -printf; ls is enough here.
          find upstream/build -name '*.deb' -exec ls -lh {} \; 2>/dev/null || echo "no .deb produced"

      - name: Upload debs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apelin-${{ inputs.flavor || 'roothide' }}-${{ github.run_number }}
          path: |
            upstream/build/Packages/*.deb
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
